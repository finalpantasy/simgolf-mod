; mods.ini: your own switches and values (docs/modding/CORE.md).
; [terrain] joined_pot_bunkers=1 joins adjacent pot bunkers visually (default 0).
; Also enable [ui] drag_placement=1 for rectangular pot-bunker placement.
; [environment]          optional native course lighting and weather (off until enabled)
; enabled=1             0 restores the original picture
; day_night=0           30-minute active playing-time loop, independent of calendar/speed
; hour=14               fixed hour with the cycle off (0 to 24)
; day_minutes=20        sunrise to sunset, active real minutes (1 to 120)
; night_minutes=10      sunset to sunrise, active real minutes (1 to 120)
; weather_wildlife=1   shelter night insects in rain/wind; 0 restores night-only behavior
; linear_light=1      display-correct terrain/sprite light and shadow attenuation
; relief_shadows=1    projected shadows follow recorded terrain elevation
; weather_shadows=1   clouds soften directional shadows and suppress them under overcast
; enclosure_shade=.55 extra sheltered shade between nearby trees and buildings, 0 disables
; material_wetness=1  terrain-normal wet highlights by source material, 0 restores previous wetness
; valley_mist=1       low mist follows valleys and fades up objects, 0 restores previous fog
; shadow_cache=1      reuse unchanged cast-shadow layers; 0 rebuilds every presentation frame
; lighting_hz=15      solar/moon direction updates per second; rain/camera keep full frame rate
; edge_aa=0.65        course-only D3D edge resolve, 0 sharp legacy; Pixel HD stays exact
; ambient_fill=0.7     cool sky fill and warm ground bounce, 0 disables
; surface_light=0.65   inferred roof/canopy light response, 0 disables
; contact_shadow=0.6   small ground contact shadows, 0 disables
; shadow_softness=1.8  height-dependent penumbra, 0 restores crisp contours
; Building window/entrance lights retired. Legacy night_lights settings are ignored.
; moon_strength=0.18    directional moonlight, 0 to 0.35; no visible moon in black mode
; cycle_minutes         legacy setting ignored, including old short preview settings
; weather=clear         clear, cloudy, rain, storm
; cloud_strength=0.65    0 to 1; soft moving cloud shade
; rain_strength=0.65     0 to 1; visible rain amount
; lighting=1            normal-based terrain lighting (requires enabled=1)
; cast_shadows=1        soft tree/people shadows; buildings keep painted daytime shadows
; terrain_shadows=1     shadows cast by raised terrain
; occlusion=1           soft darkening in terrain hollows
; quality=1             0 low, 1 medium, 2 high; bounded lighting mesh detail
; shader=1              detailed GPU clouds, rain and night effects; 0 uses simpler effects
; night_sky=1           stars and moon beyond the course; zoom out for more sky
; glowbugs=1            drifting ground lights at night
; lightning=1           storm flashes; 0 disables all lightning flashes
; reduced_flashes=1     subtler lightning by default
; sound=1               rain, wind, night insects and delayed thunder
; weather_volume=50     separate weather volume, 0 to 100; master/effects still apply
; gameplay=0            opt in with 1: rain softens rolls and affects arriving golfers' mood
; rain_roll_steps=1     grounded-ball friction adjustment (0 to 2)
; storm_roll_bonus=1    extra storm rolling drag (0 to 2)
; rain_mood_penalty=1   one-time rain mood penalty on arrival (0 to 2)
; storm_mood_bonus=1    extra storm arrival penalty (0 to 2); total capped at 2
; [golfers]
; living=0             restore original golfers, chatter and stories
; reactions=0          keep expanded memories/chatter, original mood deltas
; log=1                record observed visit/story events in the private game log
; The game reads this file unless --mods FILE, SIMGOLF_MODS, mods_ini= in
; golf.ini or a mods.ini next to golf.exe names another. Values here beat the
; mods' own settings; the bridge's mods_set changes them while the game runs.
; Everything is commented out: the active profile in mods/load_order.toml
; decides which mods load, and the mods decide their values.
;
; [performance]
; fast_loading=1         remove asset-loader sleeps and offscreen snapshot work; 0 keeps the original path
; fast_course_loading=1  reuse stable terrain heights and prepare HD ground images concurrently for a new course; 0 keeps the original path
;
; [mods]                 switch a mod on (1) or off (0) on top of the profile
; hd_presentation=0
; camera_controls=0
;
; [economy]              any "section.key" setting that a mod or feature reads
; green_fee_scale=1.0
;
; [ui]                  text drawing (card task-25)
; match_scorecard=0      0 hides the paired opponent row on a pro's modern scorecard; default 1 shows both live rounds
; font=original         the game's own faces, 1-bit, exactly as before (the ui_font mod sets plus_jakarta)
; Course hints and placement/purchase/removal labels share the native bubble typography.
; font=original or golfers=original restores their original drawing too.
; [art] clubhouse=0     0: skip the approved Parkland level1 clubhouse pack at startup. Default1; Original textures also keep the original art.
; hud=original          the original course HUD (the ui_hud mod sets frosted_mint, cards task-26/30)
; original_bottom=0    remastered Course menu and pickers (default); 1 opts into the classic construction wheel
; hd_legacy_text=1     replay legacy text at native display resolution; 0 restores bitmap text
; original_rotate_button=1  0: hide the supplemental Rotate (Tab) button while a rotatable building is armed
; shot_readout=frosted_mint ; readable shot card (default), original keeps the legacy text
; pair_story_choice=1    show the per-round story choice in modern pairing; 0 keeps the original story setup
; scale=1.5             UI scale of the Frosted Mint HUD (default: screen height / 1080)
; hud_density=jwe      the supported Corners layout: bottom-left toolbar, top-right stats
; hud_hide_key=u       the key that hides and shows the whole HUD (an SDL key name, none = off; H is the game's "open hole" key)
; golfers=original      the original name text, thought strips and golfer card (the ui_golfers mod sets frosted_mint, card task-31)
; tags=hover           names: hover (the golfer under the pointer and the selected one; Shift+N shows all), always, off (card task-60)
; bubbles=brief         thoughts: brief (big ones as a bubble for a few seconds, minor ones as a face), full, icons, off
; tag_style=plain       names as outlined text (a pill on hover) or pill
; tag_scale=0.7         size of names and bubbles (1 = the first design)
; tag_opacity=0.85      glass opacity of bubbles and pills (1 = the first design)
; bubble_ms=4000       how long a brief bubble stays (ms)
; tags_key=n           the key that shows every golfer name (an SDL key name, none = off)
; faces=original       the 2002 mood faces in the bubbles (default: the Frosted Mint ones)
; map_badges=original   golf's own property emblems in the map list (default: the painted badges, card task-109)
; paths=original         cart path help: no "No path" markers over unjoined buildings and no path view (the ui_paths mod sets frosted_mint, card task-53)
; aim=original           shot aim arrows: golf's own white dots and black ground track instead of the mint arrow (the ui_aim mod sets frosted_mint, card task-115)
; place_center=0       build a lot with its first tile under the pointer as golf does, not centred (the ui_place mod sets 1, card task-115)
; repeat_amenities=0   restore single placement for landmarks and scenic bridges (default 1: keep the chosen design armed until cancelled)
; paths_menu=1       Path view lives in the bottom-left + toolbar; 0 restores the floating button
; paths_key=y          the key that shows or hides the path view (an SDL key name, none = off); it also turns on by itself while a path or building is placed
; paths_markers=1      0: no "No path" markers (the path view stays)
; paths_opacity=1      strength of the path view's tint (0.2 to 1.5)
; paths_tint=0.30      highlight strength without fading building warning markers (0.05 to 1.5)
; frontend=original    the original start menu and new game screens (the ui_frontend mod sets frosted_mint, card task-32)
; logo=original        the game's own logo oval with "Remastered" drawn under it instead of the HD logo picture (ui/logo_remastered.png, card task-80)
; dialogs=original    the original popup menus, preferences and text entry strips (the ui_dialogs mod sets frosted_mint, card task-27)
; loading=original     the original loading screens (picture, quote, bar; the property screen's "one moment please") while the front end is Frosted Mint (card task-69)
; smooth_loading=0    0 restores the stepped loading bar; default 1 follows asset progress smoothly without delaying completion
; pro_setup=start      a new career's course opens with the pro's profile and skill points (card task-92); default original: as in 2002, the skill points come before the pro's first Practice Round (People > Your pro)
; reports=original     the original report screens (course report, comments, histograph, SGA, finances, roster, best scores, shortcuts; the ui_reports mod sets frosted_mint, card task-28)
; ball=original        the original 2 px ball and shadow (the ui_ball mod sets round: a round shaded ball, smooth flight; cards task-41/43)
; ball_size=75          size of the round ball in percent of the first version (100 = that size; default 75; Options > Gameplay > Ball size; card task-61)
; ball_colours=personal  personal (default: each golfer has a stable colour of their own, picked by their person id) or white (all balls classic white)
; ball_trail=smooth      the streak behind a ball in flight: smooth (default, a fading ribbon on the shots golf marks with a streak), all (behind every ball in flight), original (golf's own jumpy segment), off
; far_trees=0          0: the farthest zoom leaves out the trees and palms and draws at most 1024 sprites, as in the original (default 1: every tree shows, card task-90)
;
; [fixes]               port-level corrections to the original game (docs/PORT_CHANGES.md)
; extras_pictures=0     0 restores old cropped amenity icons; default 1 uses object pictures for the five modern Extras design buttons
; landmark_perks=0      0 hides benefit text in the modern landmark chooser; default 1 restores the original four benefit descriptions
; drag_scroll=0       0: fast drags cut at four tiles and map-edge overshoot must be dragged back (default 1: continuous fast pans and immediate edge reversal)
; paths_stats=0         0 restores the old fixed cart-path button position; default 1 anchors below actual original stat bars
; present_pacing=1    pace completed frames at the FPS cap; 0 restores pacing before drawing
; award_shadow=0      0: keep the original RGBA holemark still; default 1 uses source palette indices for its shadow ink
; course_shadow=0     0: keep the original course1 shade-mask behavior; default 1 reads source indices 0xf8..0xfe as slot-specific shadow planes
; bridge_connections=0  0: previous rotated bridge artwork; default 1 joins water paths in every camera rotation
; hud_layout=0        explicit legacy layout comparison; default 1 keeps the selected Corners layout and ignores older alternate density choices
; paths_overlay=0     original building tint and course dimming; default 1 uses light path-only shading
; hud_transitions=0   original transient whole-screen frames during tray transitions and Options; default 1 keeps the complete course frame
; terrain_cache=0     original duplicate texture retention after look changes; default 1 replaces matching serials
; zoom_clock=0         0: 12..20 ms frame delays can consume extra zoom motion (default 1: retain a smooth clock step through those delays)
; history_paths=0      0: the cart-path button and help can cover message history (default 1: history owns that area until closed)
; news_history=0      original frame-polled history (default 1 captures every accepted news post)
; placement_lines=0    0: the sub-tile camera shift is added twice to placement outlines and screen-space guides (default 1: their endpoints stay on the projected ground)
; staff_tiles=0        0: staff zones at map coordinates 128 and above wrap negative, as in the original byte reader (default 1: all supported map tiles work; 255 still means no zone)
; staff_circle=0       0: staff coverage inherits the employee panel's downward screen shift (default 1: world-space ring stays centered at its assigned tile)
; newcareer_landmarks=0  0: title/new-career reset keeps the previous game's landmark unlock mask (default 1: new careers start locked; sandbox and loaded saves retain their rules)
; analysis_lighting=0  0: modal shot analysis loses course sprite lighting (default 1: keep the course lighting during analysis and restore normal drawing on exit)
; re_bounds=0         0: original unchecked lookups and mode-blind shot cache (default 1: bounds and cache context checked)
; water_push=0          0: water on a slope is only raised near the camera, as in the original (black waterfall triangles after a load)
; building_overlap=0    0: a click on a standing snack bar (or any lot at level 0) places a second one on top of it and takes its price, as in the original
; female_heads=0        0: a custom head (theme packs, imported heads, index 19 and up) gives the golfer a junk skin read past the head table, as in v1.02 (the v1.03 crash fix is the default)
; clothing_palette=0    0: legacy translated palette calls. Default restores original assigned outfit colors.
; roster_skill_groups=0  0: added regular visitors keep authored single-skill defaults. Default 1 restores vanilla visitor skill assignment for unedited added regulars, preserving original hole qualification. Existing golfers on the course and player-edited/imported profiles are retained.
; no_dandelion=0     0: a new weed asks the No Dandelion landmark about a golfer's ball, not about its own tile, as in the original (default 1: the landmark protects the ground around it)
; hole_time=0         0: a save with inflated hole 1 Time to Play or truncated golfer start ticks keeps them (default 1: both are repaired at load; the clock fix itself is not switchable, it is the original behaviour)
; load_camera=0       0: loading keeps the previous camera position, as in the original (default 1: completed save loads focus the clubhouse, avoiding black views on expanded courses)
; audio_paths=0        0: the few sounds whose file name differs a little from the install (lake 1 / LAKE1, Alligator, Marshal / Marshall, the sound\ folder typo) stay silent, as in the original (default 1: they play)
; save_order=0         0: saved-game browser uses filesystem enumeration order (default 1: newest last-write date first, filename breaks ties; load/delete use that same order)
; frontend_course_state=0  0: front-end pages may inherit stale wide-canvas course pixels and weather (default 1: explicit page identity stops course presentation/audio until a real course redraw)
; safe_saves=0         0: a save is written straight over the old file, as in the original (default 1: it is written to <name>.sve.tmp, flushed to the disk and then moved over the old save, so a crash or power cut never leaves a broken save, card task-114f)
; audio_recover=0      0: when the sound device goes away (headphones unplugged, a USB or Bluetooth device off) the game stays silent until it is restarted, as in the original (default 1: it switches to the default device, card task-114c)
; bounds=0             0: the original unchecked table code: a 65th staff or walker record, more than 100 files, overlong filenames in a picker or a bad sprite index runs past its table (default 1: they are refused, card task-118)
; hole_line_centre=0   0: the white route of each tee is shifted 3 pixels sideways, as in the original (default 1: it starts at the tee's middle and ends on the cup, tester F26, card task-119)
;
; [view]               what the picture shows (card task-44)
; hide_decor_trees=0   0: Shift+T hides terrain trees only, as in the original (default 1: scenic trees, palms and swamp trees hide too)
;
; [display]              4K and widescreen (hd_presentation), over golf.ini
; ui_scale=2             auto, fit or a number: how big the game's pixels are
; smooth=0               1: the course scrolls smoothly and stops anywhere (changes live)
; smooth_zoom=0         0: the wheel zoom cuts between levels (default 1: it glides, toward the pointer; [camera] zoom_anchor=centre in golf.ini keeps the view centre); zoom_ms=200 sets the glide
; water=original       the 2002 water and its ripples (default with the HD presentation: hd, real-time water with waves,
;                       ripples, reflections, glitter, foam and waterfalls; card task-78; numbers in ui/water.txt)
;
; [skills]              the player's pro golfer (card task-74)
; cap=15                highest skill level: 10 = 100 percent (the original), 15 = 150, 20 = 200
; any_course=0          0: past 100 percent only on an 18 hole course (smaller courses keep their 6/8/10 caps); 1: on every course
; loss=1                1: a ball resting in a hazard can cost a skill point (original); 0: never
;
; [map]                 land size (card task-8): the area as a multiple of the original
; scale=1               1 = 50 x 50 tiles (original), 2 = 70 x 70, 4 = 100 x 100, 10 = 158 x 158 (max)
;                       picks the size of new games; a save always opens at its own size
;
; [ui]
; portraits=original    restore captured legacy portraits (default: direct source composition)
; portrait_preview=original  retain the old preview disc when a portrait pack is selected
; [art]
; portraits_dir=path    separate face PNGs and private Preview/ companion sheets
; [fixes]
; golfer_palette=0      restore translated palette calls without their missing arguments
;
; [art]                  the art pack (card task-17): the game's own art upscaled 4x, per category
; rock_ground_match=0    0 keeps the smooth grass baked into HD Parkland rocks; default 1 matches green ground to the regional rough while preserving neutral stones
; path_styles=1          show individual placed path materials; 0 restores original art without discarding them
; [build] path_style=original  selected new-path material: stable key from data/path-styles.def; palette sets it live
;                        any course may mix materials; cosmetics only, saved in checksum-bound .path-styles metadata
; alpha_edges=1          prevent hidden transparent colors bleeding into filtered sprite edges (0 legacy)
; look=original          every category: original (the 2002 pixels), upscaled (smooth) or locked (crisp, game colours only)
; people=locked          one category: people, buildings, trees, terrain, animals, ui, effects (any mix; changes live)
; textures=hd           the Textures choice of the Options page: hd (default), pixel_hd (crisp pixel art in the game's colours) or original; sets every category and the pixel grid
; pixel=0 / pixel_size=3 the Pixel HD grid by hand: 1 turns the grid on, size is screen pixels per art pixel (0 = one original pixel)
;
; The Options page (cards task-24, task-71): wrench menu "Options...", the Options pill on the start menu or F12. Your
; choices go to options.ini next to golf.exe (read over this file; delete it to start over). Keys it sets:
; [ui]       options=original      the original "Edit Preferences" list instead of the page
; [ui] speed_button=1             top-bar speed button: cycles 1x, 2x, 3x, 4x; 0 restores play/pause alone
; [gameplay] speed=1               game clock speed: 1, 2, 3, 4, 5 or 10 times faster (seasons, golfers, money)
; [audio]    master=100 music=100 effects=100 mute=0     volumes 0 to 100 (music: the dedicated-buffer sounds), mute=1 silences all
; [camera]   drag_button, wasd, wheel_zoom, zoom_anchor, edge_scroll, pan_speed (the keys of golf.ini [camera], now live)
; glide=0              0: responsive smooth dragging (default); 1: softer trailing camera motion; Options > Controls
; [keys]     pan_up=W | Up, tool_water=Q | none, hole_10=Shift+1 | Ctrl+K ...   two keys per action (names: Options > Controls);
;            "default" is the key set's own, camera.wasd=1 modern keys (W A S D pan; water, sand, draw on Q, C, K), 0 the 2002 keys
;
; [debug]  (card task-113) the debug overlay: a panel with live game state, every golfer and staff field, the tile and sprite
;           under the cursor, a watch list, a call tracer and a bug report button. Off by default. docs/re/README.md
; overlay=0               1: panel up from the start (live: mods_set). Shift+F12 toggles it any time.
; overlay_key=shift+f12   toggle key (modifiers shift, ctrl, alt; none = no key)
; watch=g_money_div100,g_tick   symbols to watch; trace=gameTick   functions to trace (names from tools/re, or 0xADDRESS)
; report_dir=...          where the bug report folders go (default: bugreports next to golf.exe)

; [gameplay]
; restore_camera_tiles=1 ; 0: original rough after cameras; 1: restore the original tiles (default)
[gameplay]
; Original cast remains reachable with new_roster=0.
new_roster=1
; 20 = original paid hiring limit (default); maximum 100. Existing staff are retained.
staff_max=20
manual_clubhouse=0

; [fixes] paths_stats=0 restores the old fixed cart-path button position for comparison.
; [fixes] clubhouse_loading=0 restores original-art flashes while the replacement loads.
; [fixes] practice_start=0 restores unchecked original Practice/Match allocation.

[fixes]
; 0 retains the previous port's invisible construction fades; default1 restores original float opacity.
; placement_animation=1
; Use existing HD-pack art for design chooser pictures. 0 keeps the original snapshots.
hd_design_previews=1
; When the game stops responding (20 s) or the screen stops updating (30 s), write golf.log.freeze.txt
; with where it is stuck. Diagnostic only; the game keeps running. 0 turns it off.
; freeze_report=1

; [ui] drag_placement=1 enables optional click-and-drag terrain/flower/scenic-tree rectangles
; and L-shaped paths. Default0, individual placement unchanged. Each tile uses
; the original prices and placement checks. Escape/right-click cancels selection.
; drag_tiles_per_frame=16 (1..64) bounds work so large selections stay responsive.

; Optional native atmosphere. Enable regional_weather for location/season odds.
; Fixed weather and the original game remain available with regional_weather=0.
; [environment]
; enabled=1
; regional_weather=1
; black_background=1 ; keep space beyond the course black; 0 restores decorated sky
; wet_surfaces=1 ; progressive moisture, sheen/puddling and a gradual dry-out
; splashes=1 ; rain impacts on land and painted water
; wet_seconds=18 ; override the shipped weather-surfaces.csv wetting time
; dry_seconds=100 ; drying also responds to cloud, night and wind
; report_icon=1 ; current condition, simulated temperature and humidity beside the status bar
; mist=1 ; cool humid dawn mist, optional
; haze=1 ; subtle atmospheric veil
; gusts=1 ; rain, flag cloth and enhanced water share wind
; golden_hour=1 ; warm dawn and late afternoon
; distant_thunder=1 ; quiet recorded rumble before regional storms
; temperature_units=fahrenheit ; fahrenheit or celsius; no forecast or gameplay coupling
; weather_minutes=3 ; fronts last roughly 2 to 4 unpaused minutes; seasons set the odds

; Bundled terrain: 2x detail bounds native texture memory; 1..4 supported.
; [art]
; terrain=1           0 skips the bundled ground pack, preserving the player pack.
; terrain_scale=2     higher detail uses more memory in the 32-bit game.
; [gameplay]
; authored_visitor_skills=0  Original visitor progression. 1 grants the authored regular skill mixes on arrival.

; [fixes]
; save_cancel=1       Cancel in Save returns quietly. 0 restores the invalid-name warning.
; water_occlusion=1   keep HD water behind raised ground and landmark platforms; 0 restores the old overlay

[golfers]
; Personality dialogue and memories may be enabled independently of mood changes.
reactions=0

[environment]
; Keep original ball rolls and arrival mood until explicitly enabled.
gameplay=0

; Appearance refinements remain inside the optional environment.
readability=0.8
reflections=0.44
reflection_ripple=0.8
; Rejected ground rainbow retired. Distant arc stays optional and off.
rainbows=0
rainbow_strength=0.075

; Optional buildable lighting. Off preserves original course economy.
[course_lights]
; enabled=0
